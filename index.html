<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIU - Turnos | UNSTA</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #003087;
            --success: #10b981;
        }
       
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
       
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
       
        .container {
            max-width: 560px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 48, 135, 0.15);
            overflow: hidden;
            position: relative;
        }
       
        header {
            background: linear-gradient(135deg, var(--primary), #0052cc);
            color: white;
            padding: 35px 20px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
       
        .logo {
            width: 140px;
            height: auto;
            margin-bottom: 15px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
       
        .admin-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.25);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
       
        .admin-btn:hover {
            background: rgba(255,255,255,0.4);
            transform: rotate(90deg) scale(1.1);
        }
       
        .screen {
            padding: 40px 30px;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: none;
        }
       
        .screen.active {
            display: block !important;
            opacity: 1;
            transform: translateY(0);
        }
       
        /* Resto de tus estilos (mantengo todo igual) */
        h2 { text-align: center; margin-bottom: 30px; color: #1e2937; font-weight: 600; font-size: 1.5rem; }
        input { width: 100%; padding: 16px; margin: 10px 0; border: 2px solid #e2e8f0; border-radius: 14px; font-size: 1.1rem; transition: all 0.3s ease; }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(0, 48, 135, 0.1); transform: translateY(-2px); }
        button { border: none; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        button:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0, 48, 135, 0.2); }
        .btn-primary { background: var(--primary); color: white; padding: 16px; border-radius: 14px; font-size: 1.1rem; width: 100%; margin-top: 10px; font-weight: 600; }
        .btn-secondary { background: #6b7280; color: white; padding: 16px; border-radius: 14px; width: 100%; margin-top: 10px; }
        /* ... (el resto de tus estilos se mantienen iguales) */
    </style>
</head>
<body>
<div class="container">
    <header>
        <img
            src="https://upload.wikimedia.org/wikipedia/commons/4/4c/Logo_unsta.png"
            alt="Logo UNSTA"
            class="logo"
            onerror="this.src='https://www.unsta.edu.ar/wp-content/uploads/2023/03/logo-unsta.png';"
        >
        <h1 style="font-size: 2.2rem; margin-bottom: 8px;">CIU</h1>
        <p style="opacity: 0.95;">Universidad del Norte Santo Tomás de Aquino</p>
        <button class="admin-btn" onclick="mostrarLoginAdmin()" title="Administrador">⚙️</button>
    </header>

    <!-- El resto de tu HTML se mantiene igual -->
    <!-- PANTALLA 1 -->
    <div id="screen1" class="screen active">
        <h2>Ingrese sus datos</h2>
        <input type="text" id="dni" placeholder="DNI *" maxlength="8">
        <input type="tel" id="celular" placeholder="Celular *" maxlength="15">
        <button type="button" onclick="siguientePantalla()" class="btn-primary">Continuar →</button>
    </div>

    <!-- PANTALLA 2, ÉXITO, etc. (igual que tenías) -->
    <!-- ... copia el resto desde tu código ... -->

</div>

<!-- Toast y Script (mantén todo tu JavaScript igual) -->

</body>
</html>
