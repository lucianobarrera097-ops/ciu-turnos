<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIU - Turnos | UNSTA</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #003087; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 560px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 48, 135, 0.15);
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, var(--primary), #0052cc);
            color: white;
            padding: 35px 20px 40px;
            text-align: center;
            position: relative;
        }
        .logo { width: 125px; height: 125px; margin-bottom: 15px; }

        .admin-btn {
            position: absolute; top: 20px; left: 20px;
            background: rgba(255,255,255,0.25); color: white;
            border: none; width: 50px; height: 50px;
            border-radius: 50%; font-size: 1.6rem;
            cursor: pointer;
        }

        .screen { padding: 40px 30px; display: none; }
        .screen.active { display: block; }

        h2 { text-align: center; margin-bottom: 30px; color: #1e2937; font-weight: 600; }

        input { width: 100%; padding: 16px; margin: 10px 0; border: 2px solid #e2e8f0; border-radius: 14px; font-size: 1.1rem; }

        .motivos { display: grid; gap: 14px; margin: 25px 0; }
        .motivo-btn {
            padding: 24px; border: 2px solid #e2e8f0; border-radius: 16px;
            text-align: center; font-weight: 600; background: white;
            cursor: pointer; transition: all 0.3s;
        }
        .motivo-btn:hover, .motivo-btn.active { border-color: var(--primary); background: #f0f4ff; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <img src="logo_unsta2.png" alt="Logo UNSTA" class="logo">
        <h1>CIU</h1>
        <p>Universidad del Norte Santo Tomás de Aquino</p>
        <button class="admin-btn" onclick="mostrarLoginAdmin()" title="Administrador">⚙️</button>
    </header>

    <!-- Pantalla 1 -->
    <div id="screen1" class="screen active">
        <h2>Ingrese sus datos</h2>
        <input type="text" id="dni" placeholder="DNI *" maxlength="8">
        <input type="tel" id="celular" placeholder="Celular *" maxlength="15">
        <button onclick="siguientePantalla()" style="background:#003087; color:white; padding:16px; border:none; border-radius:14px; font-size:1.1rem; width:100%; margin-top:10px;">Continuar</button>
    </div>

    <!-- Pantalla 2 -->
    <div id="screen2" class="screen">
        <h2>¿Cuál es el motivo de su consulta?</h2>
        <div class="motivos" id="motivosContainer"></div>
        <button onclick="registrarTurno()" id="btnRegistrar" disabled style="background:#003087; color:white; padding:16px; border:none; border-radius:14px; width:100%;">Obtener Turno</button>
        <button onclick="volverPantalla1()" style="background:#6b7280; margin-top:10px; width:100%;">← Volver</button>
    </div>

    <!-- Pantalla Éxito -->
    <div id="screenSuccess" class="screen" style="text-align:center; display:none; padding:60px 30px;">
        <h2 style="color:#10b981;">✅ Turno Registrado</h2>
        <p style="font-size:2.5rem; font-weight:700;" id="numeroTurno"></p>
        <button onclick="reiniciarFormulario()" style="background:#003087; color:white; padding:16px; margin-top:25px; width:100%;">Nuevo Registro</button>
    </div>
</div>
