<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIU - Turnos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        header {
            background: #003087;
            color: white;
            padding: 20px 20px 25px;
            text-align: center;
            position: relative;
        }
        .logo {
            width: 130px;
            height: 130px;
            margin-bottom: 10px;
        }

        .admin-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255,255,255,0.25);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s ease;
        }
        .admin-btn:hover {
            background: rgba(255,255,255,0.45);
            transform: scale(1.1);
        }

        .screen { padding: 40px 30px; display: none; }
        .screen.active { display: block; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; color: #333; }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        input:focus {
            border-color: #003087;
            box-shadow: 0 0 0 4px rgba(0, 48, 135, 0.15);
            transform: scale(1.03);
        }

        button {
            width: 100%;
            padding: 16px;
            background: #003087;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        button:hover { background: #002266; transform: translateY(-4px); }

        .motivos { display: grid; gap: 16px; margin: 25px 0; }
        .motivo-btn {
            padding: 24px 20px;
            text-align: center;
            border: 3px solid #e0e0e0;
            border-radius: 14px;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            color: #003087;
            background: #f8f9fa;
            transition: all 0.4s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
        }
        .motivo-btn:hover, .motivo-btn.active {
            border-color: #003087;
            background: #e6f0ff;
            transform: translateY(-8px) scale(1.03);
        }

        .success { text-align: center; padding: 40px 20px; background: #d4edda; color: #155724; border-radius: 12px; display: none; }
        #numeroTurno {
            font-size: 2rem;
            font-weight: bold;
            color: #155724;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <img src="logo_unsta2.png" alt="Logo UNSTA" class="logo">
        <h1>CIU</h1>
        <p>Universidad del Norte Santo Tomás de Aquino</p>
        
        <button class="admin-btn" onclick="mostrarLoginAdmin()">
            ⚙️ Admin
        </button>
    </header>

    <!-- Pantallas -->
    <div id="screen1" class="screen active">
        <h2 style="text-align:center; margin-bottom:25px;">Ingrese sus datos</h2>
        <div class="form-group">
            <label for="dni">DNI *</label>
            <input type="text" id="dni" maxlength="8" placeholder="12345678">
        </div>
        <div class="form-group">
            <label for="celular">Número de Celular *</label>
            <input type="tel" id="celular" maxlength="15" placeholder="987654321 o +549...">
        </div>
        <button onclick="siguientePantalla()">Continuar →</button>
    </div>

    <div id="screen2" class="screen">
        <h2 style="text-align:center; margin-bottom:25px;">Seleccione el motivo de su consulta</h2>
        <div class="motivos">
            <button class="motivo-btn" onclick="seleccionarMotivo(this)">Inscripciones</button>
            <button class="motivo-btn" onclick="seleccionarMotivo(this)">Cursos</button>
            <button class="motivo-btn" onclick="seleccionarMotivo(this)">Alumnos</button>
            <button class="motivo-btn" onclick="seleccionarMotivo(this)">Becas</button>
            <button class="motivo-btn" onclick="seleccionarMotivo(this)">Otros trámites</button>
        </div>
        <button onclick="registrarTurno()" id="btnRegistrar" disabled>Obtener Turno</button>
        <button onclick="volverPantalla1()" style="background:#666;">← Volver</button>
    </div>

    <div id="screenSuccess" class="screen success">
        <h2>✅ Turno Registrado Correctamente</h2>
        <p id="numeroTurno"></p>
        <p id="datosUsuario" style="margin:15px 0; font-size:1.1rem;"></p>
        <button onclick="reiniciarFormulario()">Nuevo Registro</button>
    </div>

    <!-- Panel Admin -->
    <div class="admin-section" style="padding:20px; background:#f8f9fa; border-top:1px solid #ddd;">
        <div id="adminPanel" style="display:none;">
            <h3>Panel de Administrador</h3>
            <div id="listaTurnos"></div>
            <button onclick="exportarExcel()" style="background:#28a745; margin-top:10px;">📊 Exportar Todo a Excel</button>
            <button onclick="logoutAdmin()" style="background:#dc3545; margin-top:8px;">Cerrar Sesión</button>
        </div>
    </div>
</div>

<!-- Modal Login -->
<div id="loginModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:white; padding:30px; border-radius:12px; width:90%; max-width:400px;">
        <h2>Iniciar Sesión como Administrador</h2>
        <input type="password" id="adminPassword" placeholder="Ingrese contraseña" style="width:100%; padding:12px; margin:15px 0; border-radius:8px;">
        <button onclick="loginAdmin()" style="background:#003087;">Entrar</button>
        <button onclick="cerrarLoginModal()" style="background:#6c757d; margin-top:8px;">Cancelar</button>
    </div>
</div>

<script>
    let datosUsuario = {};
    let turnos = [];
    let isAdminLogged = false;
    const ADMIN_PASSWORD = "admin123";

    // ==================== ANIMACIÓN CONFETI ====================
    function lanzarConfeti() {
        const colors = ['#003087', '#28a745', '#ffc107', '#dc3545', '#17a2b8'];
        for (let i = 0; i < 150; i++) {
            const confetti = document.createElement('div');
            confetti.style.position = 'fixed';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.top = '-10px';
            confetti.style.width = '10px';
            confetti.style.height = '10px';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.opacity = Math.random() + 0.5;
            confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
            confetti.style.zIndex = '9999';
            document.body.appendChild(confetti);

            const duration = Math.random() * 3 + 3;
            confetti.animate([
                { transform: `translateY(0) rotate(0deg)`, opacity: 1 },
                { transform: `translateY(${window.innerHeight + 100}px) rotate(${Math.random() * 1000}deg)`, opacity: 0 }
            ], {
                duration: duration * 1000,
                easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
            });

            setTimeout(() => confetti.remove(), duration * 1000 + 1000);
        }
    }

    // ==================== OTRAS FUNCIONES ====================
    function cargarTurnos() {
        try {
            const guardados = localStorage.getItem('ciu_turnos');
            if (guardados) turnos = JSON.parse(guardados);
        } catch(e) {}
    }

    function guardarTurnos() {
        try { localStorage.setItem('ciu_turnos', JSON.stringify(turnos)); } catch(e) {}
    }

    function renderizarLista() {
        const lista = document.getElementById('listaTurnos');
        lista.innerHTML = turnos.length === 0 
            ? '<p style="color:#888; text-align:center; padding:20px;">No hay turnos registrados</p>' 
            : turnos.slice().reverse().map(t => `
                <div style="background:white; padding:12px; margin-bottom:8px; border-radius:8px; border-left:4px solid #003087;">
                    <strong>${t.Numero_Turno}</strong> - ${t.Fecha}<br>
                    DNI: ${t.DNI} | Cel: ${t.Celular}<br>
                    <strong>${t.Motivo}</strong>
                </div>
            `).join('');
    }

    function mostrarLoginAdmin() {
        document.getElementById('loginModal').style.display = 'flex';
        document.getElementById('adminPassword').focus();
    }

    function cerrarLoginModal() {
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('adminPassword').value = '';
    }

    function loginAdmin() {
        if (document.getElementById('adminPassword').value === ADMIN_PASSWORD) {
            isAdminLogged = true;
            cerrarLoginModal();
            document.getElementById('adminPanel').style.display = 'block';
            renderizarLista();
        } else {
            alert("Contraseña incorrecta");
        }
    }

    function logoutAdmin() {
        if (confirm("¿Cerrar sesión de administrador?")) {
            isAdminLogged = false;
            document.getElementById('adminPanel').style.display = 'none';
        }
    }

    function siguientePantalla() {
        const dni = document.getElementById('dni').value.trim();
        const celular = document.getElementById('celular').value.trim();

        if (!dni || dni.length < 8 || !celular) {
            alert("Complete correctamente DNI y Celular");
            return;
        }

        datosUsuario = { dni, celular };
        document.getElementById('screen1').classList.remove('active');
        document.getElementById('screen2').classList.add('active');
    }

    function seleccionarMotivo(btn) {
        document.querySelectorAll('.motivo-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('btnRegistrar').disabled = false;
        datosUsuario.motivo = btn.textContent;
    }

    function registrarTurno() {
        const numeroTurno = "T-" + String(Math.floor(100 + Math.random() * 900));
        const fecha = new Date().toLocaleString('es-PE');

        const nuevo = {
            Numero_Turno: numeroTurno,
            Fecha: fecha,
            DNI: datosUsuario.dni,
            Celular: datosUsuario.celular,
            Motivo: datosUsuario.motivo
        };

        turnos.push(nuevo);
        guardarTurnos();
        renderizarLista();

        // Mostrar éxito
        document.getElementById('numeroTurno').innerHTML = `Tu turno es: <span style="color:#003087;">${numeroTurno}</span>`;
        document.getElementById('datosUsuario').innerHTML = `
            DNI: ${datosUsuario.dni}<br>
            Celular: ${datosUsuario.celular}<br>
            Motivo: <strong>${datosUsuario.motivo}</strong>
        `;

        document.getElementById('screen2').classList.remove('active');
        document.getElementById('screenSuccess').classList.add('active');

        // Animaciones JavaScript
        lanzarConfeti();
        
        // Pulso en el número de turno
        const numeroEl = document.getElementById('numeroTurno');
        numeroEl.style.animation = 'pulse 1.5s ease 3';
    }

    function exportarExcel() {
        if (!isAdminLogged) return alert("Debe iniciar sesión como administrador");
        if (turnos.length === 0) return alert("No hay turnos para exportar");

        const ws = XLSX.utils.json_to_sheet(turnos);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Turnos_CIU");
        XLSX.writeFile(wb, `Turnos_CIU_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    function volverPantalla1() {
        document.getElementById('screen2').classList.remove('active');
        document.getElementById('screen1').classList.add('active');
    }

    function reiniciarFormulario() {
        document.getElementById('screenSuccess').classList.remove('active');
        document.getElementById('screen1').classList.add('active');
        document.getElementById('dni').value = '';
        document.getElementById('celular').value = '';
        datosUsuario = {};
        document.querySelectorAll('.motivo-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btnRegistrar').disabled = true;
    }

    // Inicializar
    cargarTurnos();

    // Validación
    document.getElementById('dni').addEventListener('input', e => e.target.value = e.target.value.replace(/\D/g, ''));
    document.getElementById('celular').addEventListener('input', e => {
        e.target.value = e.target.value.replace(/[^0-9+]/g, '');
    });
</script>
</body>
</html>
